name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Record toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version
          node --version
      - name: Validate, test and build app
        run: |
          set -o pipefail
          make app 2>&1 | tee validation.log
      - name: Verify app signature and contents
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/Cuppa Wi-Fi.app"
          test ! -d "dist/Cuppa Wi-Fi.app/Contents/Resources/Engine"
          test -f "dist/Cuppa Wi-Fi.app/Contents/Resources/portal-schema.json"
          test -f "dist/Cuppa Wi-Fi.app/Contents/Resources/vendor-profiles.json"
          test -f "dist/Cuppa Wi-Fi.app/Contents/Resources/correction-ladder.json"
          test -z "$(find 'dist/Cuppa Wi-Fi.app' -name '*.py' -o -name '*.pyc')"
          PATH=/nonexistent "dist/Cuppa Wi-Fi.app/Contents/MacOS/CuppaAutologin" --engine-help
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuppa-native-validation
          path: validation.log
