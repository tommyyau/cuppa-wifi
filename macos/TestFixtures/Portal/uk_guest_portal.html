<!DOCTYPE html>
<html>
<head><title>Guest WiFi</title></head>
<body>
<nav>
  <form action="/lang" method="get">
    <select name="lang"><option value="en">English</option></select>
    <input type="submit" value="Go">
  </form>
</nav>
<div class="portal">
  <h1>Welcome — connect to free WiFi</h1>
  <form id="loginForm" action="/guest/connect" method="post">
    <input type="hidden" name="token" value="abc123token">
    <input type="hidden" name="mac" value="aa:bb:cc:dd:ee:ff">
    <label for="email">Email address</label>
    <input type="email" id="email" name="email" placeholder="you@example.com">
    <label for="fname">First name</label>
    <input type="text" id="fname" name="fname">
    <label for="surname">Last name</label>
    <input type="text" id="surname" name="surname">
    <label for="postcode">Postcode</label>
    <input type="text" id="postcode" name="postcode">
    <input type="checkbox" id="terms" name="terms_accepted" value="yes">
    <label for="terms">I agree to the Terms and Conditions and Privacy Policy</label>
    <input type="checkbox" id="marketing" name="marketing_opt_in" value="yes">
    <label for="marketing">Send me offers, promos and newsletters</label>
    <input type="submit" name="submit" value="Connect">
  </form>
</div>
</body>
</html>
